name: CI/CD Pipeline — Comercializadora SCZ

on:
  push:
    branches: [ main, develop, "feature/**", "release/**", "hotfix/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/api/ComercializadoraSCZ.csproj'
  TEST_PATH: 'src/tests/ComercializadoraSCZ.Tests.csproj'

jobs:
  lint:
    name: "Lint and Code Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ${{ env.PROJECT_PATH }}
      - run: dotnet tool install --global dotnet-format
      - run: dotnet format ${{ env.PROJECT_PATH }} --verify-no-changes
      - run: dotnet build ${{ env.PROJECT_PATH }} /p:TreatWarningsAsErrors=true

  build:
    name: "Build Release"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      - run: dotnet restore ${{ env.PROJECT_PATH }}
      - run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      - run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: ./publish

  test:
    name: "Test and Coverage"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ${{ env.TEST_PATH }}
      - run: |
          dotnet test ${{ env.TEST_PATH }} \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx"
      - run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage-report -reporttypes:Html,TextSummary
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: ./coverage-report

  deploy:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: staging
      url: https://staging.comercializadora-scz.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: ./publish
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: comercializadora-scz-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
      - name: Smoke Test
        run: |
          sleep 30
          curl -f https://staging.comercializadora-scz.com/health
          echo "Deploy exitoso"
